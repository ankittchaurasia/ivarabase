# Dokploy: Create Service > Compose, paste this file, and in the Environment
# tab set IVARA_DOMAIN (e.g. base.example.com) and IVARA_ADMIN_PASSWORD, then
# Redeploy (a Restart keeps the old environment).
# Dokploy's Traefik ends HTTPS. For project subdomains add a wildcard
# certificate (Traefik DNS challenge or a Cloudflare origin certificate) - see docs/DOCKER.md.
services:
  ivarabase:
    image: ghcr.io/ankittchaurasia/ivarabase:0.2-pg18
    pull_policy: always # pick up new 0.2.x releases on redeploy
    restart: unless-stopped
    environment:
      - IVARA_DOMAIN=${IVARA_DOMAIN:?set IVARA_DOMAIN, e.g. base.example.com}
      - IVARA_ADMIN_PASSWORD=${IVARA_ADMIN_PASSWORD:?set IVARA_ADMIN_PASSWORD (10+ characters, no dollar sign)}
    volumes:
      - ivarabase-data:/data
    shm_size: 256mb
    stop_grace_period: 60s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.ivarabase.rule=Host(`${IVARA_DOMAIN}`) || HostRegexp(`^[a-z0-9_-]+\.${IVARA_DOMAIN}$`)
      - traefik.http.routers.ivarabase.entrypoints=websecure
      - traefik.http.routers.ivarabase.tls=true
      - traefik.http.routers.ivarabase.tls.certresolver=letsencrypt
      - traefik.http.routers.ivarabase.tls.domains[0].main=${IVARA_DOMAIN}
      - traefik.http.routers.ivarabase.tls.domains[0].sans=*.${IVARA_DOMAIN}
      - traefik.http.services.ivarabase.loadbalancer.server.port=8787
volumes:
  ivarabase-data:
networks:
  dokploy-network:
    external: true
