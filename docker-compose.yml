# IvaraBase behind the reverse proxy your server already runs (nginx, Caddy,
# Traefik, Nginx Proxy Manager...). Point the proxy at 127.0.0.1:8787 for both
# base.example.com and *.base.example.com; `docker exec ivarabase ivarabase
# proxy-config --docker` prints a ready nginx/Caddy config. docs/DOCKER.md
#
#   docker compose up -d
#   docker exec ivarabase cat /data/secrets/INITIAL_CREDENTIALS.txt
services:
  ivarabase:
    image: ghcr.io/ankittchaurasia/ivarabase:0.2-pg18
    # build: .                       # or build from this checkout
    container_name: ivarabase
    restart: unless-stopped
    environment:
      IVARA_DOMAIN: base.example.com # panel at https://base.example.com, projects at https://<name>.base.example.com
      # IVARA_ADMIN_PASSWORD: ...    # 10+ characters; a changed value is applied on the next start. Unset: see INITIAL_CREDENTIALS.txt
      # Postgres TLS with the proxy's real certificate (verify-full); mount it below.
      # IVARA_TLS_CERT_FILE: /certs/fullchain.pem
      # IVARA_TLS_KEY_FILE: /certs/privkey.pem
    ports:
      # Only on 127.0.0.1: Docker's port rules bypass ufw and most host
      # firewalls, so 0.0.0.0 would expose IvaraBase without the proxy.
      - "127.0.0.1:8787:8787"
      # Optional direct Postgres (psql, pg_dump, ORMs). Encrypted and
      # password-protected, but open to the internet: only if you need it.
      # - "54329:54329"
    volumes:
      - ivarabase-data:/data
      # - /etc/letsencrypt/live/base.example.com:/certs:ro   # the proxy's certificate folder
    shm_size: 256mb        # Postgres needs more than Docker's 64 MB default
    stop_grace_period: 60s # time for Postgres to shut down cleanly
volumes:
  ivarabase-data:
