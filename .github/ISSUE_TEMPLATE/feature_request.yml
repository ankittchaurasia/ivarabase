name: Feature request
description: Suggest an idea or a missing Supabase-compatible feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. If it exists in Supabase, a link to their docs helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
