# Builds the Docker image (amd64 + arm64) and pushes it to ghcr.io.
# Runs on a version tag (v0.2.1 -> 0.2.1-pg18, 0.2-pg18, latest) or by hand
# from the Actions tab.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.1 (no leading v)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PG_MAJOR: "18"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and tags
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          MINOR="$(echo "$V" | cut -d. -f1-2)"
          TAGS="$IMAGE:$V-pg$PG_MAJOR,$IMAGE:$MINOR-pg$PG_MAJOR"
          # only plain releases (no -rc, -beta...) move "latest"
          case "$V" in *-*) ;; *) TAGS="$TAGS,$IMAGE:latest" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            PG_MAJOR=${{ env.PG_MAJOR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
