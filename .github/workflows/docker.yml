# One version tag publishes a release:
#   image:    Docker image (amd64 + arm64) on ghcr.io
#             (v0.2.3 -> 0.2.3-pg18, 0.2-pg18, latest)
#   binaries: Linux/macOS binaries, SHA256SUMS and the GitHub release page,
#             with notes from that version's CHANGELOG.md section
# Can also run by hand from the Actions tab (the tag must already exist).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.1 (no leading v)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PG_MAJOR: "18"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and tags
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          MINOR="$(echo "$V" | cut -d. -f1-2)"
          TAGS="$IMAGE:$V-pg$PG_MAJOR,$IMAGE:$MINOR-pg$PG_MAJOR"
          # only plain releases (no -rc, -beta...) move "latest"
          case "$V" in *-*) ;; *) TAGS="$TAGS,$IMAGE:latest" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            PG_MAJOR=${{ env.PG_MAJOR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: v${{ steps.v.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="ivarabase_${V}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X ivarabase/internal/core.Version=$V" \
              -o "build/$name/ivarabase" ./cmd/ivarabase
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Release notes
        env:
          V: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          MINOR="$(echo "$V" | cut -d. -f1-2)"
          {
            echo '**Docker** (amd64 and arm64)'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/$REPO:$MINOR-pg18"
            echo '```'
            echo
            echo "See the [Docker guide](https://github.com/$REPO/blob/main/docs/DOCKER.md). **Binaries** for Linux and macOS are attached below (check them against \`SHA256SUMS\`); they need PostgreSQL, PostgREST and Deno, see [Install without Docker](https://github.com/$REPO/blob/main/docs/DEPLOY.md)."
            echo
            # this version's section of CHANGELOG.md, without its heading
            awk -v v="$V" '
              /^## / { if (on) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { on = 1; next } }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          flags=""
          case "$V" in *-*) flags="--prerelease" ;; *) flags="--latest" ;; esac
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --title "IvaraBase $V" --notes-file notes.md $flags --verify-tag
          fi
